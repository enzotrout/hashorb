name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "**/*.md"
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Source, dependencies, workflows, and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.0"
      - name: Sync locked development environment
        run: uv sync --locked --no-python-downloads
      - name: Check security regression contracts
        run: uv run pytest -q tests/test_security_architecture.py tests/test_bitcoin_rpc.py tests/test_bitcoin_cli.py tests/test_event_logging.py tests/test_docker_distribution.py
      - name: Check source quality
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv lock --check
      - name: Scan source, dependencies, history, and workflows
        run: scripts/run-security-audit.sh source
      - name: Build and inspect private artifacts and ephemeral SBOM
        run: scripts/run-security-audit.sh artifacts

  container:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: CPU container security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build CPU image
        run: docker build --tag hashorb:security .
      - name: Run hardened offline container smoke
        run: |
          docker run --rm --read-only --tmpfs /app/logs:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700 --cap-drop=ALL --security-opt=no-new-privileges hashorb:security
          test "$(docker run --rm --entrypoint id hashorb:security -u)" = "10001"
      - name: Check image history privacy
        run: |
          if docker history --no-trunc hashorb:security | grep -qE -i 'bitcoin_address|stratum_password|YOUR_BITCOIN_ADDRESS'; then
            echo "Image history contains a forbidden configuration marker."
            exit 1
          fi
      - name: Scan CPU runtime image
        run: scripts/run-security-audit.sh image hashorb:security
