name: Dashboard terminal telemetry correction

on:
  push:
    branches:
      - local/dashboard-tui-foundation

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: local/dashboard-tui-foundation
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - run: uv sync --locked --no-python-downloads
      - name: Apply terminal telemetry correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:90]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("src/hashorb/dashboard.py")
          replace_once(
              path,
              '''    @property\n    def raw_hashes_per_second(self) -> float | None:\n''',
              '''    @property\n    def is_terminal(self) -> bool:\n        \"\"\"Return whether the active run has reached a terminal event.\"\"\"\n\n        return self.completion_outcome is not None or self.status == \"failed\"\n\n    @property\n    def raw_hashes_per_second(self) -> float | None:\n''',
          )
          replace_once(
              path,
              '''    lines.append(_rule("DEVICE / RATE", inner_width))\n    telemetry = _format_nvidia(nvidia, state.device_ordinal)\n''',
              '''    lines.append(_rule("DEVICE / RATE", inner_width))\n    if state.is_terminal and state.device_ordinal is not None:\n        telemetry = (\n            f"CUDA device {state.device_ordinal}  |  "\n            "GPU telemetry omitted for terminal run (not historical)"\n        )\n    else:\n        telemetry = _format_nvidia(nvidia, state.device_ordinal)\n''',
          )
          replace_once(
              path,
              '''        nvidia = (\n            probe_nvidia_metrics(state.device_ordinal) if state.device_ordinal is not None else None\n        )\n''',
              '''        nvidia = (\n            probe_nvidia_metrics(state.device_ordinal)\n            if state.device_ordinal is not None and not state.is_terminal\n            else None\n        )\n''',
          )
          replace_once(
              path,
              '''            nvidia = (\n                probe_nvidia_metrics(state.device_ordinal)\n                if state.device_ordinal is not None\n                else None\n            )\n''',
              '''            nvidia = (\n                probe_nvidia_metrics(state.device_ordinal)\n                if state.device_ordinal is not None and not state.is_terminal\n                else None\n            )\n''',
          )

          tests = Path("tests/test_dashboard.py")
          text = tests.read_text(encoding="utf-8")
          marker = '''    assert "Job age 00:00:09" in rendered\n\n\ndef test_dashboard_parser_rejects_nonfinite_json_numbers() -> None:\n'''
          if text.count(marker) != 1:
              raise SystemExit("expected completed snapshot test marker")
          replace_once(
              tests,
              marker,
              '''    assert "Job age 00:00:09" in rendered\n\n\ndef test_completed_once_snapshot_does_not_probe_current_gpu(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    path = tmp_path / "completed.jsonl"\n    content = (\n        "\\n".join(\n            (\n                _json_record(1, "command_started", 0),\n                _json_record(\n                    2,\n                    "compute_profile_resolved",\n                    1,\n                    requested_profile="max",\n                    effective_profile="max",\n                    effective_backend="cuda",\n                    device_ordinal=0,\n                ),\n                _json_record(\n                    3,\n                    "command_completed",\n                    2,\n                    outcome="runtime_limit_reached",\n                    effective_hashes_per_second=2_750_000_000.0,\n                ),\n            )\n        )\n        + "\\n"\n    )\n    path.write_text(content, encoding="utf-8")\n\n    def unexpected_probe(device_ordinal: int) -> None:\n        raise AssertionError(f"unexpected NVIDIA probe for device {device_ordinal}")\n\n    monkeypatch.setattr(dashboard_module, "probe_nvidia_metrics", unexpected_probe)\n    output = io.StringIO()\n\n    assert run_dashboard(path, once=True, output=output) == 0\n    assert "GPU telemetry omitted for terminal run (not historical)" in output.getvalue()\n\n\ndef test_dashboard_parser_rejects_nonfinite_json_numbers() -> None:\n''',
          )
          PY
          uv run ruff format src/hashorb/dashboard.py tests/test_dashboard.py
          uv run ruff check src/hashorb/dashboard.py tests/test_dashboard.py
          uv run mypy src
          uv run pytest -q tests/test_dashboard.py tests/test_cli.py
          git diff --check
          git rm .github/workflows/dashboard-terminal-telemetry.yml
          git add src/hashorb/dashboard.py tests/test_dashboard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(dashboard): omit live GPU telemetry from terminal runs"
          git push origin HEAD:local/dashboard-tui-foundation
