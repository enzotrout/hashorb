name: Dashboard archived snapshot correction

on:
  push:
    branches:
      - local/dashboard-tui-foundation

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: local/dashboard-tui-foundation
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - run: uv sync --locked --no-python-downloads
      - name: Apply archived-run metric correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:90]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("src/hashorb/dashboard.py")
          replace_once(
              path,
              "from typing import TextIO, cast\n",
              "from typing import Never, TextIO, cast\n",
          )
          replace_once(
              path,
              "    completion_outcome: str | None = None\n    started_at: datetime | None = None\n",
              "    completion_outcome: str | None = None\n"
              "    terminal_effective_hashes_per_second: float | None = None\n"
              "    started_at: datetime | None = None\n",
          )
          replace_once(
              path,
              '''        elif event == "command_completed":\n            self.completion_outcome = _required_string(fields, "outcome")\n            self.status = self.completion_outcome\n            self._remember(record, f"completed {self.completion_outcome}")\n''',
              '''        elif event == "command_completed":\n            self.completion_outcome = _required_string(fields, "outcome")\n            terminal_rate = _optional_number(fields, "effective_hashes_per_second")\n            if terminal_rate is not None and terminal_rate < 0:\n                raise DashboardLogError("dashboard terminal effective rate is invalid")\n            self.terminal_effective_hashes_per_second = terminal_rate\n            self.status = self.completion_outcome\n            self._remember(record, f"completed {self.completion_outcome}")\n''',
          )
          replace_once(
              path,
              '''        reference = now if now is not None else datetime.now(UTC)\n        self._prune_effective_points(reference)\n''',
              '''        if self.terminal_effective_hashes_per_second is not None:\n            return self.terminal_effective_hashes_per_second\n        reference = self._metric_reference(now)\n        self._prune_effective_points(reference)\n''',
          )
          replace_once(
              path,
              '''        reference = now if now is not None else datetime.now(UTC)\n        return max(0.0, (reference - self.started_at).total_seconds())\n\n    def job_age_seconds''',
              '''        reference = self._metric_reference(now)\n        return max(0.0, (reference - self.started_at).total_seconds())\n\n    def job_age_seconds''',
          )
          replace_once(
              path,
              '''        reference = now if now is not None else datetime.now(UTC)\n        return max(0.0, (reference - self.current_job_received_at).total_seconds())\n\n    def _reset_for_run''',
              '''        reference = self._metric_reference(now)\n        return max(0.0, (reference - self.current_job_received_at).total_seconds())\n\n    def _metric_reference(self, now: datetime | None) -> datetime:\n        if (self.completion_outcome is not None or self.status == "failed") and self.last_event_at:\n            return self.last_event_at\n        return now if now is not None else datetime.now(UTC)\n\n    def _reset_for_run''',
          )
          replace_once(
              path,
              '''        self.completion_outcome = None\n        self.started_at = record.timestamp\n''',
              '''        self.completion_outcome = None\n        self.terminal_effective_hashes_per_second = None\n        self.started_at = record.timestamp\n''',
          )
          replace_once(
              path,
              '''        raw: object = json.loads(text, object_pairs_hook=_unique_object)\n''',
              '''        raw: object = json.loads(\n            text,\n            object_pairs_hook=_unique_object,\n            parse_constant=_reject_nonfinite_constant,\n        )\n''',
          )
          replace_once(
              path,
              '''    if not isinstance(raw, dict):\n        raise DashboardLogError("dashboard record must be a JSON object")\n    record = cast(dict[str, JsonValue], raw)\n''',
              '''    if not isinstance(raw, dict):\n        raise DashboardLogError("dashboard record must be a JSON object")\n    _validate_finite_json_numbers(raw)\n    record = cast(dict[str, JsonValue], raw)\n''',
          )
          replace_once(
              path,
              '''def _unique_object(pairs: list[tuple[str, object]]) -> dict[str, object]:\n    result: dict[str, object] = {}\n    for key, value in pairs:\n        if key in result:\n            raise ValueError("duplicate JSON key")\n        result[key] = value\n    return result\n\n\ndef _validated_path''',
              '''def _unique_object(pairs: list[tuple[str, object]]) -> dict[str, object]:\n    result: dict[str, object] = {}\n    for key, value in pairs:\n        if key in result:\n            raise ValueError("duplicate JSON key")\n        result[key] = value\n    return result\n\n\ndef _reject_nonfinite_constant(value: str) -> Never:\n    raise ValueError(f"non-finite JSON number: {value}")\n\n\ndef _validate_finite_json_numbers(value: object) -> None:\n    if isinstance(value, float) and not math.isfinite(value):\n        raise DashboardLogError("dashboard record contains a non-finite number")\n    if isinstance(value, dict):\n        for nested in value.values():\n            _validate_finite_json_numbers(nested)\n    elif isinstance(value, list):\n        for nested in value:\n            _validate_finite_json_numbers(nested)\n\n\ndef _validated_path''',
          )

          tests = Path("tests/test_dashboard.py")
          text = tests.read_text(encoding="utf-8")
          marker = "\n\ndef test_nvidia_probe_requests_only_safe_metrics(\n"
          if text.count(marker) != 1:
              raise SystemExit("expected dashboard telemetry test marker")
          addition = '''\n\ndef test_completed_snapshot_uses_terminal_rate_and_freezes_elapsed_clocks() -> None:\n    state = DashboardState()\n    state.apply(_record(1, "command_started", 0.0))\n    state.apply(\n        _record(\n            2,\n            "mining_job_received",\n            1.0,\n            job_id="job-finished",\n            network_bits="1702353d",\n            clean_jobs=True,\n            merkle_branch_count=12,\n        )\n    )\n    state.apply(\n        _record(\n            3,\n            "nonce_range_completed",\n            9.0,\n            job_id="job-finished",\n            start_nonce=0,\n            stop_nonce=500_000_000,\n            hashes_checked=500_000_000,\n            elapsed_ns=181_000_000,\n            hashes_per_second=2_762_430_939.23,\n            match_found=False,\n        )\n    )\n    state.apply(\n        _record(\n            4,\n            "command_completed",\n            10.0,\n            outcome="runtime_limit_reached",\n            profile_wall_elapsed_ns=10_000_000_000,\n            effective_hashes_per_second=1_900_000_000.0,\n        )\n    )\n\n    much_later = datetime(2026, 8, 10, 12, 0, tzinfo=UTC)\n    rendered = render_dashboard(state, width=140, now=much_later, color=False)\n\n    assert state.effective_hashes_per_second(much_later) == 1_900_000_000.0\n    assert state.uptime_seconds(much_later) == 10.0\n    assert state.job_age_seconds(much_later) == 9.0\n    assert "Effective 1.900 GH/s" in rendered\n    assert "Uptime 00:00:10" in rendered\n    assert "Job age 00:00:09" in rendered\n\n\ndef test_dashboard_parser_rejects_nonfinite_json_numbers() -> None:\n    record = _json_record(1, "command_started", 0)\n    malformed = record[:-1] + ',"unsafe_metric":NaN}'\n\n    with pytest.raises(DashboardLogError, match="malformed JSON"):\n        dashboard_module.parse_dashboard_record(malformed)\n'''
          tests.write_text(text.replace(marker, addition + marker), encoding="utf-8")
          PY
          uv run ruff format src/hashorb/dashboard.py tests/test_dashboard.py
          uv run ruff check src/hashorb/dashboard.py tests/test_dashboard.py
          uv run mypy src
          uv run pytest -q tests/test_dashboard.py tests/test_cli.py
          git diff --check
          git rm .github/workflows/dashboard-archive-correction.yml
          git add src/hashorb/dashboard.py tests/test_dashboard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(dashboard): stabilize archived snapshot metrics"
          git push origin HEAD:local/dashboard-tui-foundation
