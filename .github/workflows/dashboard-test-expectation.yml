name: Dashboard CLI expectation update

on:
  push:
    branches:
      - local/dashboard-tui-foundation

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: local/dashboard-tui-foundation
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.0"
      - run: uv sync --locked --no-python-downloads
      - name: Update exact usage expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_cli.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '        "stratum-mine-chunks,stratum-mine,logs-summary,'
              'compute-benchmark,profile-info,doctor} "\n'
          )
          new = (
              '        "stratum-mine-chunks,stratum-mine,logs-summary,dashboard,'
              'compute-benchmark,"\n'
              '        "profile-info,doctor} "\n'
          )
          if text.count(old) != 2:
              raise SystemExit("expected exactly two canonical usage assertions")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format tests/test_cli.py
          uv run ruff check tests/test_cli.py
          uv run pytest -q tests/test_cli.py tests/test_dashboard.py
          git diff --check
          git rm .github/workflows/dashboard-test-expectation.yml
          git add tests/test_cli.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(dashboard): update CLI command-list expectations"
          git push origin HEAD:local/dashboard-tui-foundation
