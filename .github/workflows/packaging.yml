name: Packaging

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: CPU / ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.12.0"
      - name: Sync locked development environment
        run: uv sync --locked --no-python-downloads
      - name: Smoke development helper through Python
        run: |
          python dev --help
          python dev help
          python dev status
          python dev doctor
      - name: Smoke executable development helper
        if: runner.os != 'Windows'
        run: |
          ./dev --help
          ./dev help
      - name: Test development helper
        run: uv run pytest -q tests/test_dev_helper.py
      - name: Test shared CPU core
        run: uv run pytest -q
      - name: Smoke Windows installer dry-run
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-windows.ps1 -Action install -DryRun
      - name: Check source quality
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv lock --check
      - name: Check branch diff hygiene
        run: |
          git diff --check origin/main...HEAD
          git status --short
          git diff --stat origin/main...HEAD
      - name: Build CPU source and wheel distributions
        run: uv build --out-dir dist
        env:
          HASHORB_BUILD_CUDA: "0"
      - name: Inspect and smoke-test distributions
        run: |
          uv run python scripts/verify-distributions.py dist
          uv run python scripts/smoke-installed-distribution.py dist

  docker-cpu:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Docker CPU / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build CPU image
        run: docker build --tag hashorb:ci .
      - name: Run offline image smoke tests
        run: |
          docker run --rm hashorb:ci
          docker run --rm hashorb:ci --help
          docker run --rm hashorb:ci profile-info --profile custom --backend python --chunk-size 1000
          docker run --rm hashorb:ci compute-benchmark --backend python --hash-count 16
          test "$(docker run --rm --entrypoint id hashorb:ci -u)" = "10001"
      - name: Check image history privacy
        run: |
          if docker history --no-trunc hashorb:ci | grep -E -i 'bitcoin_address|stratum_password|YOUR_BITCOIN_ADDRESS'; then
            exit 1
          fi
