name: Verify production website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/website-verify.yml"
      - "scripts/verify-website.py"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify hashorb.com
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify deployed release content
        env:
          VERIFY_ATTEMPTS: ${{ github.event_name == 'push' && '12' || '1' }}
        run: python scripts/verify-website.py
