name: Verify production website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify hashorb.com
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify deployed release content
        env:
          VERIFY_ATTEMPTS: ${{ github.event_name == 'push' && '12' || '1' }}
        run: python scripts/verify-website.py
