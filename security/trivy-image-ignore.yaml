# Reviewed 2026-08-29 against the digest-pinned CPU runtime image. These
# suppressions expire quickly and apply only to the image scan. HashOrb does
# not invoke the affected utilities/libraries or accept their vulnerable input
# classes; the container runs non-root without capabilities and with a
# read-only root filesystem in the hardened deployment contract.
