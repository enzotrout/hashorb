<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#102b40"/>
      <stop offset="1" stop-color="#06111b"/>
    </radialGradient>
    <radialGradient id="orb" cx="32%" cy="27%" r="72%">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset="0.16" stop-color="#58e6ff"/>
      <stop offset="0.5" stop-color="#159fc5"/>
      <stop offset="0.78" stop-color="#075277"/>
      <stop offset="1" stop-color="#02131f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="url(#bg)" stroke="#25516d" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="15.5" fill="url(#orb)"/>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <ellipse cx="32" cy="32" rx="27" ry="10.5" transform="rotate(-16 32 32)" stroke="#58e6ff" stroke-width="1.8"/>
    <ellipse cx="32" cy="32" rx="10.5" ry="27" transform="rotate(-24 32 32)" stroke="#28c7ee" stroke-width="1.35" opacity=".9"/>
    <ellipse cx="32" cy="32" rx="13" ry="26" transform="rotate(57 32 32)" stroke="#ffad62" stroke-width="1.25" opacity=".85"/>
  </g>
</svg>
